  let cls='red';

}

function drawTecTable(){
  const q = (document.getElementById('tec-search').value||'').toLowerCase();
  const region = document.getElementById('tec-filter-region').value;
  const colmena = document.getElementById('tec-filter-colmena').value;
  let rows = TECH.filter(t=>{
    const okq = !q || t.nombre.toLowerCase().includes(q);
    const okr = !region || t.region===region;
    const okc = !colmena || t.colmena===colmena;
    return okq && okr && okc;
  });
  rows.sort((a,b)=>{
    const k=techSort.key;
    let va = STATUS_ORDER.includes(k) ? (a.status[k]||0) : a[k];
    let vb = STATUS_ORDER.includes(k) ? (b.status[k]||0) : b[k];
    if(typeof va==='string') return va.localeCompare(vb)*techSort.dir;
    return (va-vb)*techSort.dir;
  });
  document.getElementById('tec-tbody').innerHTML = rows.map(t=>`
    <tr data-nombre="${t.nombre}" style="cursor:pointer">
      <td>${t.nombre}</td><td>${t.region}</td><td>${t.colmena}</td>
      <td>${t.total_servicios}</td>
      <td>${t.status.Completed||0}</td><td>${t.status.Canceled||0}</td><td>${t.status.Started||0}</td>
      <td>${t.status.Aborted||0}</td><td>${t.status.Assigned||0}</td><td>${t.status.Unassigned||0}</td>
      <td>${t.dias_con_carga}</td>
      <td>${t.total_puntos}</td><td>${t.prom_puntos_dia}</td><td>${pctBadge(t.pct_meta_puntos)}</td>
      <td>${t.total_horas_est}</td><td>${t.prom_horas_dia}</td><td>${pctBadge(t.pct_meta_horas)}</td>
    </tr>`).join('');
  document.querySelectorAll('#tec-tbody tr').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      selectedTech = tr.dataset.nombre;
      document.getElementById('tec-chart-select').value = selectedTech;
      drawWeekChart();
      document.querySelector('.card h3').scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  });
}

function drawWeekChart(){
  const t = TECH.find(x=>x.nombre===selectedTech);
  if(!t) return;
  const servicios = DATES.map(d=> (t.por_dia[d]||{}).servicios || 0);
  const puntos = DATES.map(d=> (t.por_dia[d]||{}).puntos || 0);

  weekChart = safeChart(()=> new Chart(document.getElementById('chart-semana'),{
    data:{labels:DATES,
      datasets:[
        {type:'bar',label:'Servicios/día',data:servicios,backgroundColor:'#F2A900',borderRadius:5,yAxisID:'y'},
        {type:'line',label:'Puntos/día',data:puntos,borderColor:'#4a86e8',backgroundColor:'#4a86e8',tension:.3,yAxisID:'y1',pointRadius:4}
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#eaf0fa'}},title:{display:true,text:selectedTech,color:'#F2A900',font:{size:13}}},
      scales:{
        x:{ticks:{color:'#8b93a7'},grid:{display:false}},
        y:{position:'left',beginAtZero:true,ticks:{color:'#8b93a7'},grid:{color:'rgba(42,56,80,.5)'},title:{display:true,text:'Servicios',color:'#6c7488',font:{size:10}}},
        y1:{position:'right',beginAtZero:true,ticks:{color:'#4a86e8'},grid:{display:false},title:{display:true,text:'Puntos',color:'#4a86e8',font:{size:10}}}
      }}
  }));
}

        🕐 <b>Hora</b>: se genera con la misma regla del procesador Bebbia v4 — arranca 08:00 y suma 1h por servicio; si es la primera vez que aparece el técnico en el archivo reinicia en 08:00, si reaparece más adelante (no consecutivo) continúa acumulando donde iba.<br>
        ⚠️ Nota: la columna Fecha se exporta en formato <b>YYYY-mm-dd</b> tal como indica el encabezado de su plantilla. Si BeeInspired en realidad espera DD/MM/YYYY (como en su ejemplo manual), avíseme y lo ajusto.<br>

  `;
  document.getElementById('fut-fecha').addEventListener('change', drawFutTable);

function filteredFutRows(){
  const fecha = document.getElementById('fut-fecha').value;
  const scope = document.getElementById('fut-scope').value;
  return RECORDS.filter(r=>{
    if(r.fecha!==fecha) return false;
    if(!r.tec) return false;
    if(scope==='roster') return r.roster;
    if(scope==='externos') return !r.roster;
    return true;
  });
}

function drawFutTable(){
  const rows = filteredFutRows();
  document.getElementById('fut-count').textContent = `${rows.length} servicios`;
  document.getElementById('fut-tbody').innerHTML = rows.slice(0,400).map(r=>`
    <tr>
      <td>${r.id}</td><td>${r.tec}</td><td>${r.formiik||'<span style="color:#ef4444">sin FORMIIK</span>'}</td>
      <td>${r.prog}</td><td>${r.cod??''}</td><td>${r.cp}</td><td>${r.calle}</td><td>${r.colonia}</td><td>${r.municipio}</td>
      <td>${r.estado}</td><td>${r.status}</td>
    </tr>`).join('');
  if(rows.length>400) document.getElementById('fut-tbody').innerHTML += `<tr><td colspan="10" style="color:#8b93a7">... y ${rows.length-400} más (se incluyen todas en la descarga)</td></tr>`;
}

function csvEscape(v){
  v = (v===null||v===undefined) ? '' : String(v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}

function downloadPlantilla(){
  const rows = filteredFutRows();
  const headers = ['Número de Servicio','Nombre Cliente','Teléfono','Email','Código Postal','VIN (Cargadores)',
    'Num Interior','Referencia Lugar','Descripción','Codigo de Servicio','Marca del producto','comentario',
    'Fecha ("YYYY-mm-dd")','Hora("hh:mm:ss")','Técnico (num_empleado)','Servicio Pendiente',
    'Fecha Tentativa ("YYYY-mm-dd")','Telefono 2','Telefono 3','Costo Servicio','ID Presupuesto',
    'calle','colonia','delegacion_municipio','ciudad','estado','Distribuidor (Cargadores)','Tecnologia',
    'Tipo Tecnologia','Fecha solicitud cliente ("YYYY-mm-dd")','Distribuidor'];
  const lines = [headers.map(csvEscape).join(',')];
  // Horario: 08:00 + 1h por servicio. Reinicia en 08:00 la primera vez que aparece un técnico;
  // si el técnico reaparece más adelante (no consecutivo), continúa acumulando desde donde iba.
  const horaCounter = {};
  rows.forEach(r=>{
    const key = r.tec || '(( sin técnico ))';
    const n = horaCounter[key] || 0;
    horaCounter[key] = n + 1;
    const hh = String(8 + n).padStart(2,'0');
    const horaStr = `${hh}:00:00`;
    const line = [
      r.id, 'BEBBIA', '', '', r.cp, '', '', '',
      r.prog, r.cod??'', 'BEBBIA', r.prog,
      r.fecha, horaStr, r.tec, r.formiik,
      '', '', '', '', '',
      r.calle, r.colonia, r.municipio, r.municipio, r.estado, '', '', '', '', ''
    ];
    lines.push(line.map(csvEscape).join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = document.getElementById('fut-fecha').value;
  a.href = url; a.download = `Plantilla_BeeInspired_Bebbia_${fecha}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
